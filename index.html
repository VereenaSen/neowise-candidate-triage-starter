<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #result { margin-top: 1rem; }
    #message-text { color: #8a2d20; }
    #draft { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" required></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite" aria-busy="false">
    <p id="message-text"></p>
    <p id="topic"></p>
    <p id="draft"></p>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const message = document.querySelector("#message");
    const status = document.querySelector("#message-text");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      topic.textContent = "";
      draft.textContent = "";
      if (!message.value.trim()) {
        status.textContent = "Введите текст заявки, чтобы начать разбор.";
        message.focus();
        return;
      }

      result.setAttribute("aria-busy", "true");
      form.querySelector("button").disabled = true;
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const data = await reply.json();
        if (data.status === "ready" && reply.ok) {
          status.textContent = "Черновик подготовлен — проверьте его перед отправкой.";
          topic.textContent = `Тема: ${topics[data.topic]}`;
          draft.textContent = data.draft;
        } else if (data.status === "manual_review") {
          status.textContent = "Не удалось разобрать заявку автоматически. Проверьте её вручную и подготовьте ответ.";
        } else if (data.status === "invalid_input") {
          status.textContent = "Введите непустой текст заявки.";
        } else {
          throw new Error("Unexpected response");
        }
      } catch {
        status.textContent = "Сервис разбора временно недоступен. Проверьте заявку вручную и подготовьте ответ.";
      } finally {
        result.setAttribute("aria-busy", "false");
        form.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
